h1_2_mid360_square_localizer:
  ros__parameters:
    use_sim_time: true
    point_cloud_topic: /livox/mid360/points
    scan_topic: /scan
    pose_topic: /mid360_localization/pose
    status_topic: /mid360_localization/status
    base_frame: pelvis
    scan_frame: pelvis
    map_frame: map
    odom_frame: odom
    localized_frame: mid360_localized_pelvis
    publish_map_to_odom: false
    map_to_odom_transform_tolerance: 2.0
    map_to_odom_publish_rate: 50.0
    minimum_height: -0.35
    maximum_height: 1.25
    scan_minimum_range: 0.10
    minimum_range: 0.80
    maximum_range: 4.00
    scan_bin_count: 720
    scan_rate: 10.0
    transform_timeout: 1.0
    localization_rate: 2.0
    maximum_localization_points: 720
    wall_half_extent: 2.50
    wall_thickness: 0.10
    map_outside_margin: 0.50
    map_resolution: 0.05
    initial_x: 0.0
    initial_y: 0.0
    initial_yaw: 0.0
    minimum_point_count: 200
    inlier_threshold: 0.08
    minimum_inlier_fraction: 0.80
    maximum_inlier_rms: 0.05
    minimum_points_per_wall: 20
    minimum_visible_walls: 3
    localization_candidate_band: 0.50
    static_obstacle_enabled: false
    static_obstacle_minimum_x: 0.20
    static_obstacle_maximum_x: 1.00
    static_obstacle_minimum_y: -0.60
    static_obstacle_maximum_y: 0.60
