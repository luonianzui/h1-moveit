controller_manager:
  ros__parameters:
    update_rate: 100

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    torso_controller:
      type: joint_trajectory_controller/JointTrajectoryController

    left_arm_controller:
      type: joint_trajectory_controller/JointTrajectoryController

    right_arm_controller:
      type: joint_trajectory_controller/JointTrajectoryController

    left_gripper_controller:
      type: joint_trajectory_controller/JointTrajectoryController

    right_gripper_controller:
      type: joint_trajectory_controller/JointTrajectoryController

joint_state_broadcaster:
  ros__parameters:
    # Keep the controller-manager diagnostic stream away from /joint_states.
    # The public stream is the simulator-native Gazebo JointStatePublisher
    # bridge, whose header stamps come directly from each physics step.
    use_local_topics: true
    publish_dynamic_joint_states: false

torso_controller:
  ros__parameters:
    joints:
      - torso_joint
    command_interfaces:
      - position
    state_interfaces:
      - position
      - velocity
    interpolation_method: splines
    allow_nonzero_velocity_at_trajectory_end: true

left_arm_controller:
  ros__parameters:
    joints:
      - left_shoulder_pitch_joint
      - left_shoulder_roll_joint
      - left_shoulder_yaw_joint
      - left_elbow_joint
      - left_wrist_roll_joint
      - left_wrist_pitch_joint
      - left_wrist_yaw_joint
    command_interfaces:
      - position
    state_interfaces:
      - position
      - velocity
    interpolation_method: splines
    allow_nonzero_velocity_at_trajectory_end: true

right_arm_controller:
  ros__parameters:
    joints:
      - right_shoulder_pitch_joint
      - right_shoulder_roll_joint
      - right_shoulder_yaw_joint
      - right_elbow_joint
      - right_wrist_roll_joint
      - right_wrist_pitch_joint
      - right_wrist_yaw_joint
    command_interfaces:
      - position
    state_interfaces:
      - position
      - velocity
    interpolation_method: splines
    allow_nonzero_velocity_at_trajectory_end: true

right_gripper_controller:
  ros__parameters:
    joints:
      - right_dex1_finger_1_joint
      - right_dex1_finger_2_joint
    command_interfaces:
      - position
    state_interfaces:
      - position
      - velocity
    allow_nonzero_velocity_at_trajectory_end: true

left_gripper_controller:
  ros__parameters:
    joints:
      - left_dex1_finger_1_joint
      - left_dex1_finger_2_joint
    command_interfaces:
      - position
    state_interfaces:
      - position
      - velocity
    allow_nonzero_velocity_at_trajectory_end: true
