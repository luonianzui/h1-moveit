controller_manager:
  ros__parameters:
    update_rate: 500
    enforce_command_limits: true

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    unitree_h12_standby_position_controller:
      type: position_controllers/JointGroupPositionController

    unitree_h12_effort_pid_controller:
      type: pid_controller/PidController

joint_state_broadcaster:
  ros__parameters:
    use_local_topics: false
    publish_dynamic_joint_states: false

unitree_h12_standby_position_controller:
  ros__parameters:
    joints:
      - left_hip_yaw_joint
      - left_hip_pitch_joint
      - left_hip_roll_joint
      - left_knee_joint
      - left_ankle_pitch_joint
      - left_ankle_roll_joint
      - right_hip_yaw_joint
      - right_hip_pitch_joint
      - right_hip_roll_joint
      - right_knee_joint
      - right_ankle_pitch_joint
      - right_ankle_roll_joint

unitree_h12_effort_pid_controller:
  ros__parameters:
    dof_names:
      - left_hip_yaw_joint
      - left_hip_pitch_joint
      - left_hip_roll_joint
      - left_knee_joint
      - left_ankle_pitch_joint
      - left_ankle_roll_joint
      - right_hip_yaw_joint
      - right_hip_pitch_joint
      - right_hip_roll_joint
      - right_knee_joint
      - right_ankle_pitch_joint
      - right_ankle_roll_joint
    command_interface: effort
    reference_and_state_interfaces: [position, velocity]
    set_current_state_as_first_setpoint: true
    use_external_measured_states: false
    gains:
      left_hip_yaw_joint: {p: 200.0, i: 0.0, d: 2.5, u_clamp_min: -200.0, u_clamp_max: 200.0}
      left_hip_pitch_joint: {p: 200.0, i: 0.0, d: 2.5, u_clamp_min: -200.0, u_clamp_max: 200.0}
      left_hip_roll_joint: {p: 200.0, i: 0.0, d: 2.5, u_clamp_min: -200.0, u_clamp_max: 200.0}
      left_knee_joint: {p: 300.0, i: 0.0, d: 4.0, u_clamp_min: -300.0, u_clamp_max: 300.0}
      left_ankle_pitch_joint: {p: 40.0, i: 0.0, d: 2.0, u_clamp_min: -60.0, u_clamp_max: 60.0}
      left_ankle_roll_joint: {p: 40.0, i: 0.0, d: 2.0, u_clamp_min: -40.0, u_clamp_max: 40.0}
      right_hip_yaw_joint: {p: 200.0, i: 0.0, d: 2.5, u_clamp_min: -200.0, u_clamp_max: 200.0}
      right_hip_pitch_joint: {p: 200.0, i: 0.0, d: 2.5, u_clamp_min: -200.0, u_clamp_max: 200.0}
      right_hip_roll_joint: {p: 200.0, i: 0.0, d: 2.5, u_clamp_min: -200.0, u_clamp_max: 200.0}
      right_knee_joint: {p: 300.0, i: 0.0, d: 4.0, u_clamp_min: -300.0, u_clamp_max: 300.0}
      right_ankle_pitch_joint: {p: 40.0, i: 0.0, d: 2.0, u_clamp_min: -60.0, u_clamp_max: 60.0}
      right_ankle_roll_joint: {p: 40.0, i: 0.0, d: 2.0, u_clamp_min: -40.0, u_clamp_max: 40.0}
