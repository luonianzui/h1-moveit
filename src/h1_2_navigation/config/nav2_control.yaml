controller_server:
  ros__parameters:
    use_sim_time: true
    controller_frequency: 10.0
    costmap_update_timeout: 0.5
    min_x_velocity_threshold: 0.005
    min_y_velocity_threshold: 0.005
    min_theta_velocity_threshold: 0.005
    failure_tolerance: 5.0
    progress_checker_plugins:
      - progress_checker
    goal_checker_plugins:
      - goal_checker
    controller_plugins:
      - FollowPath
    progress_checker:
      plugin: nav2_controller::SimpleProgressChecker
      required_movement_radius: 0.02
      movement_time_allowance: 90.0
    goal_checker:
      plugin: nav2_controller::SimpleGoalChecker
      stateful: true
      xy_goal_tolerance: 0.04
      yaw_goal_tolerance: 0.20
    FollowPath:
      plugin: nav2_regulated_pure_pursuit_controller::RegulatedPurePursuitController
      desired_linear_vel: 0.05
      lookahead_dist: 0.25
      min_lookahead_dist: 0.20
      max_lookahead_dist: 0.35
      lookahead_time: 2.0
      rotate_to_heading_angular_vel: 0.05
      transform_tolerance: 0.30
      use_velocity_scaled_lookahead_dist: false
      min_approach_linear_velocity: 0.03
      approach_velocity_scaling_dist: 0.25
      use_collision_detection: true
      max_allowed_time_to_collision_up_to_carrot: 2.0
      use_regulated_linear_velocity_scaling: true
      use_cost_regulated_linear_velocity_scaling: true
      regulated_linear_scaling_min_radius: 0.9
      regulated_linear_scaling_min_speed: 0.03
      use_fixed_curvature_lookahead: false
      use_rotate_to_heading: true
      allow_reversing: false
      rotate_to_heading_min_angle: 0.35
      max_angular_accel: 0.40
      max_robot_pose_search_dist: 2.0

local_costmap:
  local_costmap:
    ros__parameters:
      use_sim_time: true
      update_frequency: 5.0
      publish_frequency: 2.0
      global_frame: odom
      robot_base_frame: base_footprint
      rolling_window: true
      width: 3
      height: 3
      resolution: 0.05
      transform_tolerance: 0.5
      footprint: "[[-0.45, -0.40], [-0.45, 0.40], [0.45, 0.40], [0.45, -0.40]]"
      plugins:
        - obstacle_layer
        - inflation_layer
      obstacle_layer:
        plugin: nav2_costmap_2d::ObstacleLayer
        enabled: true
        observation_sources: scan
        scan:
          topic: /scan
          data_type: LaserScan
          clearing: true
          marking: true
          obstacle_min_range: 0.10
          obstacle_max_range: 4.0
          raytrace_min_range: 0.10
          raytrace_max_range: 4.0
          max_obstacle_height: 2.5
      inflation_layer:
        plugin: nav2_costmap_2d::InflationLayer
        inflation_radius: 0.50
        cost_scaling_factor: 3.0
      always_send_full_costmap: true

behavior_server:
  ros__parameters:
    use_sim_time: true
    local_costmap_topic: local_costmap/costmap_raw
    global_costmap_topic: global_costmap/costmap_raw
    local_footprint_topic: local_costmap/published_footprint
    global_footprint_topic: global_costmap/published_footprint
    cycle_frequency: 5.0
    behavior_plugins:
      - wait
    wait:
      plugin: nav2_behaviors::Wait
    local_frame: odom
    global_frame: map
    robot_base_frame: base_footprint
    transform_tolerance: 0.5

bt_navigator:
  ros__parameters:
    use_sim_time: true
    global_frame: map
    robot_base_frame: base_footprint
    odom_topic: /odom
    bt_loop_duration: 20
    default_server_timeout: 100
    wait_for_service_timeout: 2000
    action_server_result_timeout: 300.0
    navigators:
      - navigate_to_pose
    navigate_to_pose:
      plugin: nav2_bt_navigator::NavigateToPoseNavigator

lifecycle_manager_navigation:
  ros__parameters:
    use_sim_time: true
    autostart: true
    bond_timeout: 4.0
    node_names:
      - planner_server
      - controller_server
      - behavior_server
      - bt_navigator
